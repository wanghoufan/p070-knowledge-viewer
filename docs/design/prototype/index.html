<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b4f'/%3E%3Cpath d='M7 9h18v12H13l-6 5v-5H7z' fill='none' stroke='%23fbf7ee' stroke-width='2'/%3E%3C/svg%3E">
<title>随身讲解库 · 交互原型</title>
<script>
/* 防闪：先按本地偏好写入 data-theme，再加载样式 */
(function(){
  try{
    var th = localStorage.getItem('p070.theme') || 'LIGHT';
    var mode = th === 'SYSTEM' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'DARK' : 'LIGHT') : th;
    document.documentElement.setAttribute('data-theme', mode);
  }catch(e){ document.documentElement.setAttribute('data-theme','LIGHT'); }
})();
</script>
<style>
  :root{
    --bg:#f7f2e8; --panel:#fffdf8; --panel-2:#f1ebdf; --text:#1e2a24; --muted:#5f6b63;
    --line:#ded5c6; --accent:#b9572f; --accent-soft:#f4e2d7; --accent-ink:#8f3f1f;
    --green:#2f6b4f; --green-soft:#e3efe7; --amber:#8a5a12; --amber-soft:#f7ecd4;
    --danger:#a5342a; --danger-soft:#f6e0dd; --ok:#2f6b4f;
    --radius:18px; --radius-sm:12px; --shadow:0 10px 30px rgba(46,38,24,.10);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    color-scheme:light;
  }
  html[data-theme="DARK"]{
    --bg:#151814; --panel:#1e231d; --panel-2:#262b24; --text:#f1ece1; --muted:#b7b1a3;
    --line:#3a4038; --accent:#e28a5d; --accent-soft:#3a2a21; --accent-ink:#f0b18c;
    --green:#a3d2b5; --green-soft:#23362b; --amber:#e0b879; --amber-soft:#3a3222;
    --danger:#f0a49a; --danger-soft:#3c2522; --ok:#a3d2b5;
    --shadow:0 12px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:19px;line-height:1.55}
  body{min-height:100dvh;overscroll-behavior-y:contain}
  body.lock{overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}
  a{color:var(--accent-ink);text-underline-offset:3px}
  h1,h2,h3,p{margin:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  [hidden]{display:none !important}

  /* ── 评审工具条（仅原型） ── */
  .review-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;
    padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#221f19;color:#f6f1e6;font-size:14px;
    border-bottom:1px dashed rgba(255,255,255,.28)}
  .review-bar strong{font-weight:700;letter-spacing:.02em}
  .review-bar .dirs{display:flex;gap:4px;margin-left:auto}
  .review-bar button{padding:4px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#f6f1e6;font-size:14px}
  .review-bar button[aria-pressed="true"]{background:#f6f1e6;color:#221f19;font-weight:700}

  .app{max-width:760px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom));min-height:100dvh}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fdf8ee;display:grid;place-items:center;flex:0 0 auto}
  .logo svg{width:22px;height:22px}
  .brand b{font-size:19px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:14px;color:var(--muted);line-height:1.2}
  .top-actions{display:flex;gap:4px;margin-left:auto}
  .icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
  .icon-btn:active{background:var(--panel-2)}
  .icon-btn svg{width:22px;height:22px}

  .offline-bar{display:flex;align-items:center;gap:8px;margin:10px 16px 0;padding:10px 12px;border-radius:12px;
    background:var(--amber-soft);color:var(--amber);font-size:15px;border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
  .offline-bar svg{width:18px;height:18px;flex:0 0 auto}

  main{padding:0 16px}
  .view{padding-top:12px}
  .proto-note{margin:4px 0 12px;padding:8px 11px;border-radius:10px;border:1px dashed var(--line);
    color:var(--muted);font-size:14px;line-height:1.45}

  .searchbox{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:0 12px;height:52px}
  .searchbox svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
  .searchbox input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:17px}
  .searchbox button{width:44px;height:44px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex:0 0 auto}

  .seg{display:flex;gap:4px;background:var(--panel-2);border-radius:12px;padding:4px;margin-top:12px}
  .seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:15px;color:var(--muted);min-height:44px}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}

  .filter-label{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;font-size:14px;color:var(--muted);letter-spacing:.04em}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    font-size:15px;color:var(--muted);min-height:44px}
  .chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fbf7ee;font-weight:600}
  .resultline{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:15px;color:var(--muted)}
  .resultline b{color:var(--text);font-size:17px}
  .linkbtn{margin-left:auto;color:var(--accent-ink);font-size:15px;text-decoration:underline;text-underline-offset:3px;min-height:44px}

  /* ── 资料卡片：三种视觉方向 ── */
  .cards{display:grid;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    text-align:left;width:100%;display:block}
  .cover{position:relative;width:100%;aspect-ratio:16/9;background:var(--panel-2);overflow:hidden}
  .cover .art{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);
    font-size:40px;font-weight:700;color:#fff;letter-spacing:.02em}
  .cover .status{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;
    padding:4px 8px;border-radius:999px;font-size:14px;font-weight:700;background:rgba(20,24,20,.72);color:#fff;backdrop-filter:blur(4px)}
  .cover .status.offline{background:rgba(47,107,79,.9)}
  .cover .status.fail{background:rgba(165,52,42,.9)}
  .card-body{padding:12px 14px 14px}
  .card h3{font-size:20px;line-height:1.35;font-weight:700}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted);font-size:14px}
  .card .sum{margin-top:7px;font-size:15px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .app[data-dir="A"] .cards{grid-template-columns:1fr 1fr}
  .app[data-dir="A"] .cover .art{background:linear-gradient(150deg,#2f6b4f,#6c9a7d)}
  .app[data-dir="A"] .card:nth-child(2n) .cover .art{background:linear-gradient(150deg,#b9572f,#d99a72)}
  .app[data-dir="A"] .card:nth-child(3n) .cover .art{background:linear-gradient(150deg,#3a4a63,#7c8ca6)}

  .app[data-dir="B"]{--radius:6px;--radius-sm:4px}
  .app[data-dir="B"] .cards{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
  .app[data-dir="B"] .card{display:grid;grid-template-columns:104px 1fr;border-radius:0;border:0;border-bottom:1px solid var(--line);background:transparent}
  .app[data-dir="B"] .cover{aspect-ratio:auto;height:88px;border-radius:4px;margin:12px 0 12px 0}
  .app[data-dir="B"] .cover .art{font-size:26px;background:linear-gradient(150deg,#3c4a3f,#6f7f6c);color:#f7f1e4}
  .app[data-dir="B"] .cover .status{display:none}
  .app[data-dir="B"] .card-body{padding:12px 4px 12px 12px}
  .app[data-dir="B"] .card h3,.app[data-dir="B"] .brand b,.app[data-dir="B"] h1,.app[data-dir="B"] h2{font-family:var(--serif)}
  .app[data-dir="B"] .card h3{font-size:18px}
  .app[data-dir="B"] .card .sum{-webkit-line-clamp:2}
  .app[data-dir="B"] .card .meta{margin-top:4px}
  .app[data-dir="B"] .tag{background:transparent;border:1px solid var(--line);border-radius:3px}

  .app[data-dir="C"]{--radius:22px}
  .app[data-dir="C"] .cards{display:flex;flex-direction:column;gap:16px}
  .app[data-dir="C"] .card{border:0;background:transparent;border-radius:0}
  .app[data-dir="C"] .cover{aspect-ratio:4/3;border-radius:20px;box-shadow:var(--shadow)}
  .app[data-dir="C"] .cover .art{font-size:58px;background:linear-gradient(160deg,#1f2a24,#3d5145 55%,#b9572f)}
  .app[data-dir="C"] .card:first-child .cover{aspect-ratio:16/10}
  .app[data-dir="C"] .card-body{padding:12px 2px 4px}
  .app[data-dir="C"] .card h3{font-family:var(--serif);font-size:24px;line-height:1.25}
  .app[data-dir="C"] .card:first-child h3{font-size:29px}
  .app[data-dir="C"] .card .sum{font-size:15.5px;-webkit-line-clamp:2}
  .app[data-dir="C"] .card:not(:first-child){display:grid;grid-template-columns:112px 1fr;gap:12px;border-top:1px solid var(--line);padding-top:14px}
  .app[data-dir="C"] .card:not(:first-child) .cover{aspect-ratio:1/1;border-radius:12px;box-shadow:none}
  .app[data-dir="C"] .card:not(:first-child) .cover .art{font-size:30px}
  .app[data-dir="C"] .card:not(:first-child) .card-body{padding:0}

  .empty{margin:28px 0;padding:22px 18px;border:1px dashed var(--line);border-radius:16px;background:var(--panel);text-align:center}
  .empty .big{font-size:23px;font-weight:700;margin-bottom:8px}
  .empty p{font-size:15px;color:var(--muted);line-height:1.6}
  .empty .actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:10px 16px;
    border-radius:12px;font-size:16px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--text)}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fbf7ee}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff8f2}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-soft)}
  .btn:disabled{opacity:.45}
  .btn svg{width:18px;height:18px}

  /* ── 底栏 ── */
  .tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:760px;z-index:45;
    display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--panel) 94%,transparent);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:12px;
    color:var(--muted);font-size:14px;min-height:52px;justify-content:center}
  .tabbar button svg{width:23px;height:23px}
  .tabbar button[aria-pressed="true"]{color:var(--green);font-weight:700}
  .tabbar button[aria-pressed="true"] .dot{opacity:1}
  .tabbar .dot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0}

  /* ── 详情 ── */
  .pagehead{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
  .pagehead .back{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-left:-8px}
  .pagehead h2{font-size:21px;line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player{position:relative;border-radius:16px;overflow:hidden;background:#101410;aspect-ratio:16/9;border:1px solid var(--line)}
  .player video{width:100%;height:100%;display:block;background:#101410}
  .player .badge{position:absolute;top:8px;left:8px;background:rgba(16,20,16,.72);color:#fff;font-size:14px;
    padding:4px 9px;border-radius:999px;backdrop-filter:blur(4px)}
  .resume{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 11px;border-radius:10px;background:var(--panel-2);font-size:14px;color:var(--muted)}
  .resume button{margin-left:auto;color:var(--accent-ink);font-weight:700;font-size:14px;min-height:36px;padding:0 6px}
  .detail-title{font-size:26px;line-height:1.3;margin:14px 0 6px;font-weight:800}
  .detail-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
  .actions .btn{width:100%}
  .actions .wide{grid-column:1/-1}
  .block{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
  .block h3{font-size:15px;color:var(--muted);letter-spacing:.04em;margin-bottom:8px;font-weight:700}
  .block p{font-size:19px;line-height:1.72}
  .block p + p{margin-top:8px}
  .source{display:flex;align-items:flex-start;gap:8px;font-size:15px;color:var(--muted);word-break:break-all}
  .source svg{width:18px;height:18px;flex:0 0 auto;margin-top:2px}
  details.transcript{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
  details.transcript summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 2px;font-weight:700;font-size:17px;cursor:pointer;min-height:48px}
  details.transcript summary::-webkit-details-marker{display:none}
  details.transcript summary .chev{margin-left:auto;transition:transform .2s}
  details.transcript[open] summary .chev{transform:rotate(180deg)}
  .transcript-body{font-size:19px;line-height:1.75;color:var(--text);padding-bottom:10px}
  .transcript-body p + p{margin-top:10px}
  .terms{width:100%;border-collapse:collapse;font-size:16px}
  .terms th,.terms td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .terms th{color:var(--muted);font-weight:600;font-size:14px}
  .terms tr:last-child td{border-bottom:0}
  .warnline{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:10px;
    background:var(--amber-soft);color:var(--amber);font-size:15px;line-height:1.5}
  .warnline svg{width:17px;height:17px;flex:0 0 auto;margin-top:2px}
  .statusrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:var(--muted);flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:14px;font-weight:700}
  .pill.offline{background:var(--green-soft);color:var(--ok)}
  .pill.online{background:var(--panel-2);color:var(--muted)}
  .pill.fail{background:var(--danger-soft);color:var(--danger)}
  .progress{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:8px}
  .progress i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}

  /* ── 分享清单 ── */
  .share-head{display:flex;align-items:center;gap:8px;margin:0 0 10px}
  .share-head h1{font-size:27px;font-weight:800;flex:1}
  .selectall{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:15px;color:var(--muted)}
  .selectall input{width:22px;height:22px;accent-color:var(--green)}
  .share-row{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .share-row input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:0 0 auto}
  .share-row .grow{flex:1;min-width:0}
  .share-row b{display:block;font-size:16.5px;line-height:1.4}
  .share-row .url{font-size:14px;color:var(--muted);word-break:break-all;margin-top:3px}
  .share-row .missing{font-size:14px;color:var(--amber);margin-top:3px}
  .share-row .del{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
  .share-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}
  .share-actions .wide{grid-column:1/-1}

  /* ── 设置 ── */
  .setting{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .setting h3{font-size:15px;color:var(--muted);margin-bottom:10px;letter-spacing:.03em}
  .setting .row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .setting .row:last-child{border-bottom:0;padding-bottom:0}
  .setting .row .grow{flex:1;min-width:0}
  .setting .row b{font-size:16.5px;display:block}
  .setting .row small{font-size:14px;color:var(--muted);display:block;line-height:1.4}
  .setting select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 10px;font-size:15px;max-width:180px}
  .switch{position:relative;width:58px;height:44px;flex:0 0 auto}
  .switch input{position:absolute;z-index:2;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch span{position:absolute;left:0;right:0;top:7px;height:30px;border-radius:999px;background:var(--line);transition:.2s;pointer-events:none}
  .switch span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked + span{background:var(--green)}
  .switch input:checked + span:before{transform:translateX(22px)}
  .storage-line{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:var(--muted);margin:8px 0 4px}
  .cache-item{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:15px;border-bottom:1px dashed var(--line)}
  .cache-item:last-child{border-bottom:0}
  .cache-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cache-item button{color:var(--danger);font-size:14px;min-height:44px;min-width:52px;padding:0 8px;border-radius:8px}
  .about{font-size:14px;color:var(--muted);line-height:1.65}
  .about b{color:var(--text)}

  /* ── 启动页 ── */
  .splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center}
  .splash .mark{width:88px;height:88px;border-radius:26px;background:var(--green);color:#fbf7ee;display:grid;place-items:center;box-shadow:var(--shadow)}
  .splash .mark svg{width:50px;height:50px}
  .splash h1{font-size:30px;font-weight:800;letter-spacing:.01em}
  .splash p{font-size:15px;color:var(--muted);max-width:280px}
  .splash .enter{margin-top:8px;min-width:150px}
  .splash .skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));font-size:14px;color:var(--muted)}
  .app[data-dir="B"] ~ .splash h1{font-family:var(--serif)}

  /* ── 讲解模式 ── */
  .slide-overlay{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column}
  .slide-top{display:flex;align-items:center;gap:10px;color:var(--text);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
  .slide-top .title{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slide-top .icon-btn{color:var(--text)}
  .slide-top .page{font-size:14px;color:var(--muted);min-width:44px;text-align:right;white-space:nowrap}
  .slide-frame{flex:1;position:relative;background:var(--bg);min-height:0}
  .slide-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fbf7ef}
  .slide-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;background:var(--bg);z-index:2}
  .slide-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    color:var(--text);text-align:center;padding:28px;background:var(--bg);z-index:3}
  .slide-error h3{font-size:22px;color:var(--text)}
  .slide-error p{font-size:15px;color:var(--muted);max-width:320px}
  .slide-bottom{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
  .slide-bottom button{width:58px;height:52px;border-radius:14px;background:var(--panel-2);color:var(--text);display:grid;place-items:center;border:1px solid var(--line)}
  .slide-bottom button:active{background:var(--line)}
  .slide-bottom .hint{font-size:14px;color:var(--muted);max-width:190px;text-align:center;line-height:1.4}

  /* ── 弹窗 / 提示 ── */
  .dialog-mask{position:fixed;inset:0;z-index:150;background:rgba(12,14,11,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
  .dialog{width:100%;max-width:560px;background:var(--panel);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88dvh;overflow:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(24px);opacity:.7}to{transform:none;opacity:1}}
  .dialog h3{font-size:21px;margin-bottom:8px}
  .dialog .body{font-size:15.5px;color:var(--muted);line-height:1.65}
  .dialog .body p + p{margin-top:8px}
  .dialog .body textarea{width:100%;min-height:150px;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;line-height:1.5}
  .dialog .actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .dialog .actions .btn{width:100%}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
    z-index:180;background:#1e241e;color:#f6f1e6;padding:11px 16px;border-radius:12px;font-size:15px;max-width:86vw;
    opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .toast.on{opacity:1;transform:translateX(-50%)}

  @media (max-width:380px){
    .app[data-dir="A"] .cards{grid-template-columns:1fr}
    body{font-size:19px}
    .actions{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  }

<body>

<div class="splash" id="splash">
  <div class="mark" id="splashMark" aria-hidden="true"></div>
  <h1 id="splashName">随身讲解库</h1>
  <p id="splashTag">把视频、总结和讲解稿装进一个离线小库。</p>
  <button class="btn primary enter" id="splashEnter">进入资料库</button>
  <div class="skip" id="splashBrand">品牌候选 A · Pocket Brief</div>
</div>

<div class="review-bar" id="reviewBar" role="note">
  <strong>原型评审</strong><span>设计方向：</span>
  <div class="dirs" role="group" aria-label="设计方向对照">
    <button data-dir="A" aria-pressed="true">A 卡片</button>
    <button data-dir="B" aria-pressed="false">B 手册</button>
    <button data-dir="C" aria-pressed="false">C 剧场</button>
  </div>
</div>

<div class="app" id="app" data-dir="A">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10H9l-4 3v-3H4z"/><path d="M8 9h8M8 12h5"/></svg>
      </div>
      <div><b id="brandName">随身讲解库</b><small id="brandSub">离线也能讲</small></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnImport" aria-label="导入资料">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M18 6l-1.4 1.4M7.4 16.6L6 18"/></svg>
      </button>
    </div>
  </header>

  <div class="offline-bar" id="offlineBar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l16 16"/><path d="M8.5 15.5a5 5 0 0 1 3-1.4M5.5 12a9 9 0 0 1 4-2.3M15 9.6a9 9 0 0 1 3.5 2.4M2.5 8.5a14 14 0 0 1 4-2.3M17.5 6.2a14 14 0 0 1 4 2.3"/><circle cx="12" cy="19" r="1"/></svg>
    <span id="offlineText">当前离线：已缓存的视频和讲解稿仍可打开。</span>
  </div>

  <main>
    <section class="view" id="view-library">
      <div class="proto-note" id="protoNote">原型演示数据，不是真实课程资料。真实内容由你在 Mac 上准备后导入。</div>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="searchInput" type="search" placeholder="搜标题、标签或术语" aria-label="搜索资料">
        <button id="searchClear" aria-label="清空搜索" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="seg" id="langSeg" role="group" aria-label="语言筛选">
        <button data-lang="all" aria-pressed="true">全部</button>
        <button data-lang="zh" aria-pressed="false">中文</button>
        <button data-lang="en" aria-pressed="false">English</button>
      </div>

      <div class="filter-label"><span id="topicLabel">专题</span></div>
      <div class="chips" id="topicChips" role="group" aria-label="专题筛选"></div>
      <div class="filter-label"><span id="tagLabel">标签</span></div>
      <div class="chips" id="tagChips" role="group" aria-label="标签筛选"></div>

      <div class="resultline">
        <span id="resultCount">共 5 条</span>
        <button class="linkbtn" id="clearFilters" hidden>清除筛选</button>
      </div>
      <div class="cards" id="cards"></div>
      <div class="empty" id="libEmpty" hidden>
        <div class="big" id="emptyTitle">没有符合条件的资料</div>
        <p id="emptyText">换一个关键词，或清除语言和标签筛选再试。</p>
        <div class="actions"><button class="btn ghost" id="emptyClear">清除筛选</button></div>
      </div>
    </section>

    <section class="view" id="view-detail" hidden></section>
    <section class="view" id="view-share" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button data-nav="library" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h6.5v13H4zM13.5 5.5H20v13h-6.5z"/><path d="M6.5 9h1.5M16 9h1.5"/></svg>
      <span>资料库</span><i class="dot"></i>
    </button>
    <button data-nav="share" aria-pressed="false">

      <span>分享清单</span><i class="dot"></i>
    </button>
  </nav>
</div>

<div class="slide-overlay" id="slideOverlay" hidden>
  <div class="slide-top">
    <button class="icon-btn" id="slideExit" aria-label="退出讲解">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="title" id="slideTitle">讲解模式</div>
    <span class="page" id="slidePage" hidden>1 / 1</span>
    <button class="icon-btn" id="slideFull" aria-label="全屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div class="slide-frame" id="slideFrame">
    <iframe id="slideIframe" sandbox="allow-scripts" allowfullscreen referrerpolicy="no-referrer" title="HTML 讲解稿"></iframe>
    <div class="slide-loading" id="slideLoading">正在打开讲解稿…</div>
    <div class="slide-error" id="slideError" hidden>
      <h3 id="slideErrTitle">讲解稿打不开</h3>
      <p id="slideErrText">文件可能缺失，或不是单文件离线版本。</p>
      <button class="btn primary" id="slideErrBack">返回视频详情</button>
    </div>
  </div>
  <div class="slide-bottom">
    <button id="slidePrev" aria-label="上一页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="hint" id="slideHint">点两侧按钮翻页，也可在讲解稿内左右滑动</div>
    <button id="slideNext" aria-label="下一页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<div id="dialogRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  /* ───────────────────────── IndexedDB ───────────────────────── */
  var DB_NAME = 'p070-proto', DB_VER = 1, dbPromise = null, memItems = [];
  function openDB(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      if (!window.indexedDB) return reject(new Error('no indexedDB'));
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function(){
        var db = req.result;
        if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath:'id' });
        if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath:'id' });
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function idbAll(store){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readonly'), r = tx.objectStore(store).getAll();
        r.onsuccess = function(){ resolve(r.result || []); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }
  function idbPut(store, value){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readwrite'), r = tx.objectStore(store).put(value);
        r.onsuccess = function(){ resolve(true); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }
  function idbDel(store, key){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readwrite'), r = tx.objectStore(store).delete(key);
        r.onsuccess = function(){ resolve(true); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }
  function idbClear(store){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readwrite'), r = tx.objectStore(store).clear();
        r.onsuccess = function(){ resolve(true); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }

  function loadItems(){
    return idbAll('items').then(function(rows){
      if (!rows.length) {
        return Promise.all(DEMO_ITEMS.map(function(it){ return idbPut('items', it); })).then(function(){ return DEMO_ITEMS.slice(); });
      }
      rows.sort(function(a, b){ return DEMO_ITEMS.findIndex(function(d){ return d.id === a.id; }) - DEMO_ITEMS.findIndex(function(d){ return d.id === b.id; }); });
      return rows;
    }).catch(function(){
      state.dbOK = false;
      memItems = DEMO_ITEMS.slice();
      return memItems;
    });
  }
  function loadMedia(){
    return idbAll('media').then(function(rows){
      var map = {};

      return map;
    }).catch(function(){ return {}; });
  }

  function cacheItem(id, silent){
    var it = getItem(id);
    if (!it) return;
    var bar = $('#cacheBtn');
    if (state.simQuota) {
      state.failMap[id] = true;
      toast(t('saveFailed'));
      if (state.view === 'detail') renderDetail(id);
      renderLibrary();
      return;
    }
    if (bar) { bar.disabled = true; bar.textContent = t('loading'); }
    var progress = document.createElement('div');
    progress.className = 'progress';
    progress.innerHTML = '<i></i>';
    if (bar) bar.parentNode.insertBefore(progress, bar.nextSibling);
    var fetchVideo = fetch('assets/demo.mp4').then(function(r){
      if (!r.ok) throw new Error('video ' + r.status);
      var total = Number(r.headers.get('content-length')) || 0;
      if (!r.body || !total) return r.blob();
      var reader = r.body.getReader(), chunks = [], loaded = 0;
      function pump(){
        return reader.read().then(function(res){
          if (res.done) return new Blob(chunks, { type:'video/mp4' });
          chunks.push(res.value); loaded += res.value.length;
          var i = progress.querySelector('i'); if (i) i.style.width = Math.min(100, loaded / total * 100) + '%';
          return pump();
        });
      }
      return pump();
    });
    var fetchSlide = (it.slides && it.slides !== 'missing')
      ? fetch('assets/slides/demo-slide.html').then(function(r){ if (!r.ok) throw new Error('slide'); return r.text(); })
      : Promise.resolve('');
    Promise.all([fetchVideo, fetchSlide]).then(function(res){
      var rec = { id:id, videoBlob:res[0], slideText:res[1] || '', bytes:res[0].size + (res[1] ? new Blob([res[1]]).size : 0), cachedAt:Date.now() };
      return idbPut('media', rec).then(function(){
        state.media[id] = rec;
        delete state.failMap[id];
        if (!silent) toast(t('saved'));
        if (state.view === 'detail' && state.currentId === id) renderDetail(id);
        renderLibrary();
      });
    }).catch(function(){
      state.failMap[id] = true;
      if (!silent) toast(t('saveFailed'));
      if (state.view === 'detail' && state.currentId === id) renderDetail(id);
      renderLibrary();
    });
  }

  function bridgeScript(){
    return ['<script>', '(function(){',
      'function send(m){try{parent.postMessage(m,"*")}catch(e){}}',
      'try{send({type:"p070:ready"});}catch(e){}',
      'window.addEventListener("message",function(e){var d=e.data||{};if(d.type==="p070:nav"){var k=d.dir==="next"?"ArrowRight":"ArrowLeft";document.dispatchEvent(new KeyboardEvent("keydown",{key:k,bubbles:true}));}});',
      'window.addEventListener("keydown",function(e){if(e.key==="Escape")send({type:"p070:exit"});});',
      '})();', '<' + '/script>'].join('\n');

  function hardenSlide(html){
    var csp = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: blob:; media-src data: blob:; style-src \'unsafe-inline\' data: blob:; script-src \'unsafe-inline\' \'unsafe-eval\' blob: data:; font-src data: blob:; connect-src \'none\'; frame-src \'none\'; form-action \'none\'; base-uri \'none\'">';
    var out = String(html);
    out = out.replace(/<base[^>]*>/gi, '');
    if (/<head[^>]*>/i.test(out)) out = out.replace(/<head([^>]*)>/i, '<head$1>' + csp);
    else out = csp + out;
    if (/<\/body>/i.test(out)) out = out.replace(/<\/body>/i, bridgeScript() + '</body>');
    else out += bridgeScript();
    return out;
  }
  function pushSlideHistory(){
    if (slideHistory) return;

  function mountSlide(html){

      slideUrl = URL.createObjectURL(blob);
      $('#slideIframe').hidden = false;
      $('#slideIframe').src = slideUrl;
      setTimeout(function(){ $('#slideLoading').hidden = true; pushSlideHistory(); }, 60);

    $('#resetDemo').onclick = function(){
      dialog(t('resetDemoQ'), '<p>' + t('resetDemoBody') + '</p>', [
        { label:t('resetDemo'), cls:'danger', fn:function(){ resetDemo(); } },
        { label:t('cancel'), cls:'ghost' }
      ]);
    };
    $('#simOffline').onchange = function(){ state.simOffline = this.checked; persist('simOffline', state.simOffline); renderLibrary(); };
    $('#simQuota').onchange = function(){ state.simQuota = this.checked; persist('simQuota', state.simQuota); toast(state.simQuota ? t('quotaSimOn') : t('quotaSimOff')); };
  }
  function showBrandCandidates(){
    var rows = [
      { d:'A', cn:'随身讲解库 / 随身讲义', en:'Pocket Brief / Handy Deck', icon:'圆角方形绿底 + 对话气泡里叠幻灯片框；线性起、选中转面性', splash:'纸暖底 + 绿色标记居中 + 名称 + 「离线也能讲」；1.6 秒可跳过' },
      { d:'B', cn:'讲解随行 / 讲解手册', en:'Carry Deck / Deckbook', icon:'米白底 + 打开的手册/书脊 + 两条索引线；细线方角', splash:'米白底 + 线稿标记偏上 + 名称 + 一条细横线；无动画' },
      { d:'C', cn:'一页讲解 / 随行一页', en:'SlideSide / OnePage', icon:'深底 + 单张幻灯片框 + 一束聚光；大留白、极少细节', splash:'近黑底 + 标记居中 + 暖陶红呼吸光晕 + 大号衬线名；无进度线' }
    ];
    var body = '<div style="display:flex;flex-direction:column;gap:10px">' + rows.map(function(r){
      return '<div style="border:1px solid var(--line);border-radius:12px;padding:10px">' +
        '<b>' + r.d + ' · ' + esc(r.cn) + '</b>' +
        '<div style="font-size:14px;margin-top:4px"><b>' + t('brandNameCn') + '：</b>' + esc(r.cn) + '</div>' +
        '<div style="font-size:14px"><b>' + t('brandNameEn') + '：</b>' + esc(r.en) + '</div>' +
        '<div style="font-size:14px"><b>' + t('brandIcon') + '：</b>' + esc(r.icon) + '</div>' +
        '<div style="font-size:14px"><b>' + t('brandSplash') + '：</b>' + esc(r.splash) + '</div></div>';
    }).join('') + '</div><p style="margin-top:10px">' + t('brandNote') + '</p>';
    dialog(t('brandTitle'), body, [{ label:t('close'), cls:'primary' }]);
  }
  function resetDemo(){
    Promise.all([idbClear('items'), idbClear('media')]).then(function(){
      return Promise.all(DEMO_ITEMS.map(function(it){ return idbPut('items', it); }));
    }).then(function(){
      state.items = DEMO_ITEMS.slice(); state.media = {}; state.failMap = {}; state.share = []; state.lastImport = null;
      persist('share', []); persist('pos', {});
      showView('library'); toast(t('done'));
    }).catch(function(){
      state.items = DEMO_ITEMS.slice(); state.media = {}; state.failMap = {}; state.share = [];
      showView('library'); toast(t('done'));
    });
  }

  /* ───────────────────────── 视图切换 ───────────────────────── */
  function showView(name){
    state.view = name;
    $$('.view').forEach(function(v){ v.hidden = true; });
    var map = { library:'#view-library', detail:'#view-detail', share:'#view-share', settings:'#view-settings' };
    $(map[name]).hidden = false;
    var immersive = name === 'detail' || name === 'settings';
    $('#tabbar').hidden = immersive;
    $$('#tabbar button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-nav') === name)); });
    if (name === 'library') renderLibrary();
    if (name === 'share') renderShare();
    if (name === 'settings') renderSettings();
    if (name === 'library') { requestAnimationFrame(function(){ window.scrollTo(0, state.libScroll || 0); }); }
    else if (!immersive) window.scrollTo({ top:0, behavior:'instant' });
  }
  function renderDetailIfOpen(){ if (state.view === 'detail' && state.currentId) renderDetail(state.currentId); }

  /* ───────────────────────── 弹窗 ───────────────────────── */
  function dialog(title, bodyHTML, actions){
    var root = $('#dialogRoot');
    root.innerHTML = '<div class="dialog-mask"><div class="dialog" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<h3>' + esc(title) + '</h3><div class="body">' + bodyHTML + '</div><div class="actions"></div></div></div>';
    var box = $('.dialog .actions', root);
    (actions || [{ label:t('close'), cls:'primary' }]).forEach(function(a){
      var b = document.createElement('button');
      b.className = 'btn ' + (a.cls || 'ghost');
      b.textContent = a.label;
      b.onclick = function(){ if (a.fn) a.fn(); closeDialog(); };
      box.appendChild(b);
    });
    $('.dialog-mask', root).onclick = function(e){ if (e.target === e.currentTarget) closeDialog(); };
  }
  function closeDialog(){ $('#dialogRoot').innerHTML = ''; }

  /* ───────────────────────── 导入 ───────────────────────── */
  function importManifest(file){
    file.text().then(function(txt){
      var data;
      try { data = JSON.parse(txt); } catch(e){ return toast(t('importBad')); }
      var list = Array.isArray(data) ? data : (data.items || []);
      list = list.filter(function(x){ return x && x.id && x.title; });
      if (!list.length) return toast(t('importNone'));
      var existing = list.filter(function(x){ return !!getItem(x.id); });
      if (existing.length) {
        dialog(t('duplicateTitle'), '<p>' + t('duplicateBody', { n:existing.length }) + '</p>', [
          { label:t('dupKeep'), cls:'primary', fn:function(){ applyImport(list, 'keep'); } },
          { label:t('dupReplace'), cls:'', fn:function(){ applyImport(list, 'replace'); } },
          { label:t('dupSkip'), cls:'', fn:function(){ applyImport(list, 'skip'); } },
          { label:t('dupCancel'), cls:'ghost' }
        ]);
      } else {
        applyImport(list, 'keep');
      }
    }).catch(function(){ toast(t('attachBad')); });
  }
  function applyImport(list, mode){
    var added = 0, updated = 0, skipped = 0;
    var work = list.map(function(raw){
      var it = {
        id:String(raw.id), title:String(raw.title), topic:raw.topic || '未分类',
        language:raw.language === 'en' ? 'en' : 'zh', tags:Array.isArray(raw.tags) ? raw.tags : [],
        duration:Number(raw.duration) || 5, cover:String(raw.cover || raw.title.slice(0, 1)),
        summary:raw.summary || '', transcript:raw.transcript || '',
        terms:Array.isArray(raw.terms) ? raw.terms : [],
        source_url:raw.source_url || '', slides:raw.slides === false ? 'missing' : (raw.slides || 'demo')
      };
      var old = getItem(it.id);
      if (old) {
        if (mode === 'skip') { skipped++; return Promise.resolve(); }
        if (mode === 'replace') { return idbDel('media', it.id).then(function(){ delete state.media[it.id]; }).then(function(){ updated++; return idbPut('items', it); }); }
        updated++; return idbPut('items', it);
      }
      added++; return idbPut('items', it);
    });
    Promise.all(work).then(function(){
      return idbAll('items');
    }).then(function(rows){
      state.items = rows;
      state.lastImport = new Date().toLocaleString() + ' · +' + added + ' / ~' + updated;
      renderLibrary(); renderSettings();
      if (state.view === 'settings') renderSettings();
      toast(t('importResult', { a:added, b:updated }));
    }).catch(function(){ toast(t('importBad')); });
  }

  /* ───────────────────────── 启动 ───────────────────────── */
  function bindStatic(){
    $('#splashEnter').onclick = function(){ dismissSplash(); };
    $('#splash').onclick = function(e){ if (e.target.id === 'splash') dismissSplash(); };

    $('#searchInput').oninput = function(){
      state.filters.q = this.value;
      $('#searchClear').hidden = !this.value;
      renderLibrary();
    };
    $('#searchClear').onclick = function(){ $('#searchInput').value = ''; state.filters.q = ''; $('#searchClear').hidden = true; renderLibrary(); };
    $$('#langSeg [data-lang]').forEach(function(b){
      b.onclick = function(){ state.filters.lang = b.getAttribute('data-lang'); renderLibrary(); };
    });
    $('#clearFilters').onclick = function(){ state.filters = { q:'', lang:'all', topic:'all', tag:'all' }; $('#searchInput').value = ''; $('#searchClear').hidden = true; renderLibrary(); };
    $('#emptyClear').onclick = function(){ $('#clearFilters').onclick(); };

    $$('#tabbar button').forEach(function(b){
      b.onclick = function(){ showView(b.getAttribute('data-nav')); };
    });
    $('#btnSettings').onclick = function(){ showView('settings'); };
    $('#btnImport').onclick = function(){ $('#fileManifest').click(); };
    $('#fileManifest').onchange = function(){
      var f = this.files && this.files[0];
      if (f) importManifest(f);
      this.value = '';
    };

    $$('#reviewBar [data-dir]').forEach(function(b){
      b.onclick = function(){
        state.dir = b.getAttribute('data-dir'); persist('dir', state.dir); applyDir(); renderLibrary(); toast(t('dirSaved'));
      };
    });

    $('#slideExit').onclick = function(){ closeSlides(); };
    $('#slideErrBack').onclick = function(){ closeSlides(); };
    $('#slidePrev').onclick = function(){ navSlide('prev'); };
    $('#slideNext').onclick = function(){ navSlide('next'); };
    $('#slideFull').onclick = function(){
      var el = $('#slideOverlay');
      if (document.fullscreenElement) { document.exitFullscreen().catch(function(){}); return; }
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){ toast('当前环境不支持全屏'); });
    };
    window.addEventListener('message', function(e){
      var d = e.data || {};
      if (d.type === 'p070:exit') closeSlides();
      if (d.type === 'p070:page' && d.total) { var pg = $('#slidePage'); pg.hidden = false; pg.textContent = d.index + ' / ' + d.total; }
    });
    window.addEventListener('popstate', function(){
      if (!$('#slideOverlay').hidden) closeSlides(true);
    });
    window.addEventListener('keydown', function(e){
      if ($('#slideOverlay').hidden) return;
      if (e.key === 'Escape') closeSlides();
      if (e.key === 'ArrowRight') navSlide('next');
      if (e.key === 'ArrowLeft') navSlide('prev');
    });

    window.addEventListener('online', renderLibrary);
    window.addEventListener('offline', renderLibrary);
    var mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function(){ if (state.theme === 'SYSTEM') applyTheme(); });

    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden') { var v = $('#detailVideo'); if (v && !v.paused) v.pause(); }
    });
  }

  function dismissSplash(){
    var s = $('#splash');
    if (!s || s.hidden) return;
    s.style.transition = 'opacity .25s';
    s.style.opacity = '0';
    setTimeout(function(){ s.hidden = true; }, 260);
  }

  function boot(){
    state.theme = restore('theme', 'LIGHT');
    state.language = restore('language', 'SYSTEM');
    state.dir = restore('dir', 'A');
    state.share = restore('share', []);
    state.simOffline = restore('simOffline', false);
    state.simQuota = restore('simQuota', false);
    if (!Array.isArray(state.share)) state.share = [];
    applyTheme();
    bindStatic();
    applyDir();

    Promise.all([loadItems(), loadMedia()]).then(function(res){
      state.items = res[0];
      state.media = res[1];
      state.loading = false;
      if (!state.dbOK) toast(t('dbFail'));
      applyLanguage();
      renderLibrary();
      if (!state.dbOK) $('#offlineBar').hidden = false;
      setTimeout(dismissSplash, 1600);
      /* 首次运行时真实缓存一条示例（仅在 http/https 下可 fetch；file:// 会如实失败） */
      if (!isOffline('warmup') && location.protocol.indexOf('http') === 0) {
        cacheItem('warmup', true);
      }
    }).catch(function(){
      state.items = DEMO_ITEMS.slice();
      state.loading = false;
      applyLanguage();
      renderLibrary();
      setTimeout(dismissSplash, 1600);
    });
  }

  boot();
})();
</script>
</body>
</html>
