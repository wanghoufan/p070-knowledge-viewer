{id:'pk1',title:'匹克球基础规则',en:'Pickleball Basic Rules',lang:'zh',topic:'匹克球',tags:['规则','入门'],time:'08:32',art:'court',summary:['比赛可以是单打，也可以是双打。','发球通常采用对角线方向，发球必须越过非截击区。','非截击区（俗称厨房区）内不得凌空截击。','熟悉计分和轮换方式，再开始正式比赛。'],transcript:'这是模拟转写文本，仅用于展示原始文稿如何展开。\n\n大家好，今天来介绍匹克球的基础规则。首先认识球场结构，球网两边都设有非截击区。发球时站在底线后方，通常沿对角线发向对面。双打时双方要配合移动，并注意换发球时机。',terms:[['Non-volley zone','非截击区 / 厨房区'],['Serve','发球'],['Doubles','双打'],['Baseline','底线']],slides:true,source:''},

iv>`:''}</div></div><div class="content-card"><div class="card-head"><h3>讲解时可用的英语术语</h3><span style="font-size:11px;color:var(--muted)">${x.terms.length} 个</span></div><div class="card-body"><div class="term-grid">${(x.terms||[]).map(a=>`<div class="term-card"><strong>${esc(a[0])}</strong><small>${esc(a[1])}</small></div>`).join('')}</div></div></div><div class="content-card"><div class="card-head"><h3>HTML 讲解课件</h3></div><div class="card-body"><div class="slides-entry"><div class="iconbox">${icon('presentation',26)}</div><div style="flex:1;min-width:0"><strong>${hasSlides?'HTML 幻灯片':'尚未导入课件'}</strong><small>${hasSlides?'现场全屏展示 · 支持翻页':'可导入 AI 生成的单文件 HTML'}</small></div><button data-action="slides-open">${hasSlides?'打开课件':'导入课件'}</button></div><button class="pillbtn full" style="margin-top:8px;min-height:38px" data-action="pick-html">${icon('plus',15)}导入 / 替换 HTML 课件</button></div></div><div class="content-card"><div class="card-head"><h3>原视频来源</h3></div><div class="card-body"><div class="row" style="gap:8px"><span style="font-size:12px;color:var(--muted);word-break:break-all">${esc(liveSrc(x)||'尚未填写真实视频链接')}</span><button class="pillbtn" style="flex-shrink:0" data-action="source-edit">${icon('edit',15)}编辑</button></div>${liveSrc(x)?`<button class="pillbtn full" style="margin-top:8px" data-action="source-open">${icon('external',15)}打开原视频</button>`:''}</div></div><p class="muted-note" style="margin:13px 3px">原型用于确认布局和操作。正式 PWA 需要在小米/OPPO 自带浏览器实际验证视频离线缓存与 HTML 安全隔离。</p></main></div>`}
function offline(){const cached=all().filter(x=>state.cached[x.id]?.video||state.cached[x.id]?.html);return `${brandHeader()}<main class="content screen"><h1 class="sectiontitle">已缓存的内容</h1><p class="subline">不用网络也能打开已保存的文件。示例视频不计入已缓存。</p><div class="settings"><div class="setting"><span class="lefticon">${icon('download',24)}</span><div><strong>手机本地资料</strong><small>已保存 ${cached.length} 条资料相关文件</small></div><span class="trailing">${cached.length} 项</span></div></div>${cached.length?cached.map(x=>`<div class="offline-item"><div class="small-square">${icon('film',23)}</div><div style="min-width:0;flex:1"><strong>${esc(x.title)}</strong><small>${state.cached[x.id]?.video?'视频 · ':''}${state.cached[x.id]?.html?'HTML 课件':''}</small></div><button class="pillbtn" data-action="open" data-id="${esc(x.id)}">打开</button><button class="pillbtn" data-action="remove-cache" data-id="${esc(x.id)}" title="删除本地缓存">${icon('trash',15)}</button></div>`).join(''):`<div class="empty">${icon('download',30)}<h3>暂无保存的视频</h3>先到资料详情导入 MP4 或 HTML 课件，导入成功后会在这里显示。<p><button class="pillbtn green" data-action="tab" data-val="home">浏览资料</button></p></div>`}<div class="note-box">提示：这是独立 HTML 原型，不具备正式 PWA 的 Service Worker 与安装能力；浏览器也可能清理本地文件。重要视频请保留 Mac 原件。</div></main>`}
function shareString(){const selected=state.selected.map(find).filter(Boolean);const valid=selected.filter(x=>/^https?:\/\//i.test(liveSrc(x)));return `Pickleball · Videos to Watch\n\n`+valid.map((x,i)=>`${i+1}. ${x.en||x.title}\n${liveSrc(x)}`).join('\n\n')}
function share(){const chosen=state.selected.map(find).filter(Boolean);const valid=chosen.filter(x=>/^https?:\/\//i.test(liveSrc(x)));return `${brandHeader()}<main class="content screen"><h1 class="sectiontitle">分享清单</h1><p class="subline">勾选学习资料，把原视频网页链接发给外国朋友。</p><div class="settings"><div class="setting"><span class="lefticon">${icon('share',23)}</span><div><strong>已选 ${chosen.length} 项</strong><small>${valid.length} 条有真实来源链接</small></div><button class="pillbtn" data-action="clear-share" style="margin-left:auto">清空</button></div></div>${chosen.length?chosen.map(x=>`<div class="share-item"><input type="checkbox" checked data-action="share-check" data-id="${esc(x.id)}" aria-label="选择${esc(x.title)}"><div class="sharebody"><strong>${esc(x.title)}</strong><small>${esc(x.en||'')} · ${liveSrc(x)?'已设置链接':'未设置来源链接'}</small></div><button class="head-btn" style="width:33px;height:33px" data-action="open" data-id="${esc(x.id)}" title="打开详情">${icon('chevron',18)}</button></div>`).join('')+`<div class="sectionbar"><strong>分享预览</strong><small>仅包含有效原视频网址</small></div><div class="share-preview">${esc(valid.length?shareString():'没有可分享的网址。请进入视频详情，先填写真实来源链接。')}</div><div class="share-actions"><button class="pillbtn green" style="flex:1" ${valid.length?'':'disabled'} data-action="copy-share">${icon('copy',16)}复制链接清单</button><button class="pillbtn" style="flex:1" ${valid.length?'':'disabled'} data-action="system-share">${icon('share',16)}系统分享</button></div>`:`<div class="empty">${icon('share',30)}<h3>还没有分享项目</h3>在资料列表点击每条视频旁边的「＋」，即可加入分享清单。<p><button class="pillbtn green" data-action="tab" data-val="home">去选视频</button></p></div>`}<div class="note-box">朋友收到的是 B 站 / YouTube 等来源平台的公开视频网址，不是你手机缓存的 MP4 文件。来源是否可用取决于对方的网络与平台访问条件。</div></main>`}
function settings(){const dark=document.documentElement.dataset.theme==='dark';return `${brandHeader()}<main class="content screen"><h1 class="sectiontitle">设置</h1><div class="settings"><div class="setting"><span class="lefticon">${icon('download',22)}</span><div><strong>离线资料管理</strong><small>查看已导入视频及 HTML 幻灯片</small></div><button class="head-btn right" data-action="tab" data-val="offline">${icon('chevron',19)}</button></div><div class="setting"><span class="lefticon">${icon('folder',22)}</span><div><strong>导入学习资料</strong><small>JSON 文字清单 / 单条媒体文件</small></div><button class="head-btn right" data-action="import">${icon('chevron',19)}</button></div><div class="setting"><span class="lefticon">${icon(dark?'moon':'sun',22)}</span><div><strong>深色模式</strong><small>首次默认浅色，可随时切换</small></div><button class="mini-toggle ${dark?'on':''} right" data-action="theme" role="switch" aria-checked="${dark}" aria-label="切换深色模式"><span></span></button></div><div class="setting"><span class="lefticon">${icon('info',22)}</span><div><strong>语言显示</strong><small>中文界面 · 保留英语标题与术语</small></div></div></div><div class="note-box">随身讲解库 / Pocket Presenter<br>版本 V0.3 · 手机 HTML 交互原型<br>不包含视频下载、AI 总结或 HTML PPT 制作。</div><div style="text-align:center;color:var(--muted);font-size:11px;margin-top:22px">先把内容准备好，再随身展示给朋友。</div></main>`}
function render(){const body=state.detail?detail():state.tab==='home'?library():state.tab==='offline'?offline():state.tab==='share'?share():settings();document.getElementById('app').innerHTML=body+bottom();if(state.detail)loadVideo(state.detail)}
function refreshResults(){const r=document.getElementById('result-area');if(r)r.innerHTML=libraryResults(filtered())}
function backToList(){state.detail=null;state.expanded=false;cleanupVideo();render();scrollTo({top:0,behavior:'instant'})}
function goTab(t){cleanupVideo();state.detail=null;state.expanded=false;state.tab=t;render();scrollTo({top:0,behavior:'instant'})}
function openItem(id){if(!find(id))return;cleanupVideo();state.detail=id;state.expanded=false;render();scrollTo({top:0,behavior:'instant'})}
function updateShare(id){state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];storage.set('p070_selected',state.selected);if(state.detail){let b=document.querySelector('[data-action="share-toggle"]');if(b){b.innerHTML=icon(state.selected.includes(id)?'check':'plus',16)+(state.selected.includes(id)?'已加入分享':'加入分享')}const nav=document.querySelector('.bottom');if(nav)nav.outerHTML=bottom()}else render();notice(state.selected.includes(id)?'已加入分享清单':'已从分享清单移除')}
function overlay(title,content){const dom=document.createElement('div');dom.className='overlay';dom.id='sheet-overlay';dom.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-title"><span>${esc(title)}</span><button class="sheet-close" data-action="overlay-close">×</button></div>${content}</div>`;dom.addEventListener('click',ev=>{if(ev.target===dom)dom.remove()});document.getElementById('portal').appendChild(dom)}
function askImport(){overlay('导入学习资料',`<p class="summary-text">视频下载、转写、AI 整理和 HTML PPT 制作已在外部完成。这里仅导入整理好的资料。</p><button class="pillbtn green full" data-action="pick-json" style="margin-top:12px">${icon('folder',17)}选择 JSON 知识清单</button><button class="pillbtn full" data-action="download-json" style="margin-top:9px">${icon('download',17)}下载 JSON 示例格式</button><div class="note-box">在详情页还可以分别导入 MP4 视频和自包含单文件 HTML 幻灯片。导入实际大文件之前，正式 PWA 必须完成国产浏览器测试。</div>`)}
function askSource(){const x=find(state.detail);if(!x)return;overlay('设置原视频链接',`<p class="subline">${esc(x.title)}</p><label for="source-url" class="field-label">完整网页地址</label><input class="text-input" id="source-url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?..." value="${esc(liveSrc(x))}"><p class="muted-note">只保存链接，不上传视频副本。请填写真实 B 站 / YouTube 网页地址。</p><button class="pillbtn green full" style="margin-top:12px" data-action="save-source">保存链接</button>`)}
function saveSource(){let value=document.getElementById('source-url')?.value.trim()||'';if(value&&!/^https?:\/\//i.test(value)){notice('请输入 http:// 或 https:// 开头的网址');return}const x=find(state.detail);if(!x)return;state.sources[x.id]=value;storage.set('p070_sources',state.sources);document.getElementById('sheet-overlay')?.remove();render();notice('来源链接已保存')}
function demoSlide(i){const slides=[{title:'匹克球场地',en:'Pickleball Court',list:['球场中间有球网','球网两侧为非截击区（厨房区）','认识区域后再讲解规则'],court:1},{title:'发球规则',en:'Serving Rules',list:['站在底线之后发球','通常斜线发向对面发球区','以实际采用的比赛规则为准']},{title:'厨房区是什么？',en:'Non-volley Zone',list:['中文通常称作非截击区','英文常称 Kitchen','此区域内不能凌空截击']},{title:'一起练习吧',en:'Let’s Play!',list:['Warm up first. 先热身','Serve diagonally. 对角线发球','Have fun! 玩得开心']}];const s=slides[i];return `<div class="slide-board"><div class="slide-content"><h2>${s.title}</h2><div class="en">${s.en}</div>${s.court?`<div class="court-diagram"><div></div><div>Kitchen<br>非截击区</div><div></div></div>`:''}<ul>${s.list.map(a=>`<li>${a}</li>`).join('')}</ul></div></div>`}
function openSlides(){const x=find(state.detail);if(!x)return;document.querySelector('video')?.pause();if(state.cached[x.id]?.html){getFile(x.id,'html').then(file=>{if(!file){delete state.cached[x.id].html;storage.set('p070_cached',state.cached);notice('课件文件已失效，请重新导入');return}showImportedSlides(file,x.title)});return}if(!x.slides){notice('请先导入单文件 HTML 幻灯片');document.getElementById('html-file').click();return}state.slideId=x.id;state.slideNo=0;const el=document.createElement('div');el.className='slide-modal';el.id='slide-modal';el.innerHTML=`<div class="slide-top"><button data-action="slide-close">‹ 返回资料</button><span>HTML 讲解课件 · 示例</span><button data-action="slide-fullscreen">全屏</button></div><div class="slide-center" id="slide-center">${demoSlide(0)}</div><div class="slide-controls"><button data-action="slide-prev" aria-label="上一页">‹</button><span id="slide-count">1 / 4</span><button data-action="slide-next" aria-label="下一页">›</button></div>`;document.getElementById('portal').appendChild(el);let startX=null;el.querySelector('#slide-center').addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});el.querySelector('#slide-center').addEventListener('touchend',e=>{if(startX===null)return;let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>55)stepSlide(dx<0?1:-1);startX=null},{passive:true})}
function showImportedSlides(file,title){if(!state.detail)return;if(state.slideUrl)URL.revokeObjectURL(state.slideUrl);state.slideUrl=URL.createObjectURL(new Blob([file],{type:'text/html'}));const el=document.createElement('div');el.className='slide-modal';el.id='slide-modal';el.innerHTML=`<div class="slide-top"><button data-action="slide-close">‹ 返回资料</button><span>${esc(title)} · HTML</span><button data-action="slide-fullscreen">全屏</button></div><div class="slide-center" style="padding:0"><iframe src="${state.slideUrl}" sandbox="allow-scripts" title="导入的 HTML 幻灯片（隔离展示）" referrerpolicy="no-referrer" allowfullscreen></iframe></div><div style="color:#fff;font-size:11px;text-align:center;padding:10px">课件内翻页操作由原 HTML 实现 · 无法联通主应用数据</div>`;document.getElementById('portal').appendChild(el)}
function stepSlide(shift){state.slideNo=Math.max(0,Math.min(3,state.slideNo+shift));const c=document.getElementById('slide-center');if(c)c.innerHTML=demoSlide(state.slideNo);const t=document.getElementById('slide-count');if(t)t.textContent=`${state.slideNo+1} / 4`}
function closeSlides(){const el=document.getElementById('slide-modal');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});el?.remove();if(state.slideUrl){URL.revokeObjectURL(state.slideUrl);state.slideUrl=null}}
function fullSlides(){const el=document.getElementById('slide-modal');if(!el)return;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>notice('当前浏览器已使用页面全屏布局'));else if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else notice('已使用页面全屏布局')}
function db(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(Error('浏览器不可用'));const req=indexedDB.open('p070-demo-media',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files')};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function saveFile(id,type,file){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('files','readwrite');tx.objectStore('files').put(file,id+'|'+type);tx.oncomplete=()=>{d.close();res(true)};tx.onerror=()=>{d.close();rej(tx.error)};tx.onabort=()=>{d.close();rej(tx.error)}})}
async function removeFiles(id){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('files','readwrite');tx.objectStore('files').delete(id+'|video');tx.objectStore('files').delete(id+'|html');tx.oncomplete=()=>{d.close();res()};tx.onerror=()=>{d.close();rej(tx.error)}})}
async function getFile(id,type){try{const d=await db();const val=await new Promise((res,rej)=>{const tx=d.transaction('files');const q=tx.objectStore('files').get(id+'|'+type);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});d.close();return val||null}catch{return null}}
function cleanupVideo(){const v=document.querySelector('video');if(v)v.pause();if(state.videoUrl){URL.revokeObjectURL(state.videoUrl);state.videoUrl=null}}
async function loadVideo(id){const x=find(id);if(!x)return;const saved=state.cached[id]?.video;let file=saved?await getFile(id,'video'):null;if(id!==state.detail)return;const host=document.getElementById('video-host');if(!host)return;if(!file&&saved){state.cached[id].video=false;storage.set('p070_cached',state.cached);const stat=document.getElementById('video-status');if(stat)stat.textContent='已保存标记失效，请重新导入视频'}if(!file){if(id==='pk1'){const sample=document.getElementById('embedded-demo-video');if(sample?.textContent?.trim()){try{const b64=sample.textContent.trim();host.innerHTML=`<video controls playsinline preload="metadata" poster="" src="data:video/mp4;base64,${b64}"></video>`;return}catch{}}}return}cleanupVideo();state.videoUrl=URL.createObjectURL(file);host.innerHTML=`<video src="${state.videoUrl}" controls playsinline preload="metadata" aria-label="已导入的本地视频"></video>`;document.getElementById('video-status').textContent='✓ 已加载已保存的本地视频';}
function demoFormat(){const example={version:1,items:[{id:'my-pickleball-video-01',title:'我的匹克球教学视频',en:'My Pickleball Tutorial',lang:'zh',topic:'匹克球',tags:['规则','入门'],time:'05:20',summary:['第一条重点','第二条重点'],transcript:'这里放已经转写整理好的原文稿',terms:[['Non-volley zone','非截击区']],source:'',slides:false}]};const blob=new Blob([JSON.stringify(example,null,2)],{type:'application/json'});downloadBlob(blob,'P070-knowledge-pack-example.json')}
function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);notice('链接清单已复制')}catch{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();notice(ok?'已复制，可以粘贴发送':'复制失败，请手动选择文本')}}
async function nativeShare(){const txt=shareString();if(navigator.share){try{await navigator.share({title:'Pickleball · Videos to Watch',text:txt})}catch(e){if(e.name!=='AbortError')copyText(txt)}}else copyText(txt)}
function normalizeItem(x,i){if(!x||typeof x!=='object'||!String(x.title||'').trim())return null;const t=Array.isArray(x.tags)?x.tags.slice(0,8).map(s=>String(s).slice(0,15)):[];return {id:('custom-'+String(x.id||Date.now()+'-'+i)).replace(/[^A-Za-z0-9_-]/g,'-').slice(0,100),title:String(x.title).slice(0,90),en:String(x.en||'').slice(0,100),lang:x.lang==='en'?'en':'zh',topic:String(x.topic||'未分类').slice(0,30),tags:t,time:String(x.time||''),art:'court',summary:(Array.isArray(x.summary)?x.summary:[x.summary||'']).map(String).slice(0,15),transcript:String(x.transcript||''),terms:(Array.isArray(x.terms)?x.terms:[]).slice(0,30).filter(t=>Array.isArray(t)&&t.length>=2).map(t=>[String(t[0]),String(t[1])]),slides:false,source:String(x.source||'').trim()}};
const fileInputs=()=>{
 document.getElementById('video-file').onchange=async e=>{const file=e.target.files?.[0],id=state.detail;if(!file||!id)return;try{if(!/\.(mp4|webm|mov|m4v)$/i.test(file.name))throw Error('请使用 MP4、WebM 等视频文件');await saveFile(id,'video',file);state.cached[id]={...state.cached[id],video:true};storage.set('p070_cached',state.cached);render();notice('视频已保存至当前浏览器')}catch(err){notice('保存失败：'+err.message)}finally{e.target.value=''}};
 document.getElementById('html-file').onchange=async e=>{const file=e.target.files?.[0],id=state.detail;if(!file||!id)return;try{if(!/\.html?$/i.test(file.name))throw Error('请使用单文件 HTML 课件');if(file.size>40*1024*1024)throw Error('演示原型限制 HTML 小于 40 MB');await saveFile(id,'html',file);state.cached[id]={...state.cached[id],html:true};storage.set('p070_cached',state.cached);render();notice('HTML 幻灯片已保存')}catch(err){notice('保存失败：'+err.message)}finally{e.target.value=''}};
 document.getElementById('json-file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const txt=await file.text(),json=JSON.parse(txt);const arr=Array.isArray(json)?json:json.items;if(!Array.isArray(arr)||arr.length>150)throw Error('请提供包含 1—150 条 items 的 JSON');const added=arr.map(normalizeItem).filter(Boolean);if(!added.length)throw Error('清单中没有有效资料');for(const x of added){const i=state.custom.findIndex(y=>y.id===x.id);if(i>=0)state.custom[i]=x;else state.custom.push(x)}storage.set('p070_custom',state.custom);document.getElementById('sheet-overlay')?.remove();state.tab='home';state.detail=null;state.lang='all';state.tag='全部';state.q='';render();notice(`已导入 ${added.length} 条资料`)}catch(err){notice('导入失败：'+err.message)}finally{e.target.value=''}};
};
function handleClick(e){const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;const id=btn.dataset.id;const val=btn.dataset.val;
 if(a==='tab')goTab(val);else if(a==='theme')changeTheme();else if(a==='language'){state.lang=val;render()}else if(a==='tag'){state.tag=val;render()}else if(a==='reset'){state.lang='all';state.tag='全部';state.q='';render()}else if(a==='open')openItem(id);else if(a==='close-detail')backToList();else if(a==='share-toggle')updateShare(id||state.detail);else if(a==='transcript'){state.expanded=!state.expanded;document.getElementById('transcript-indicator').textContent=state.expanded?'收起 −':'展开 ＋';document.getElementById('transcript-container').innerHTML=state.expanded?`<div class="acc-body">${esc(find(state.detail)?.transcript||'')}</div>`:'';}else if(a==='import')askImport();else if(a==='overlay-close')document.getElementById('sheet-overlay')?.remove();else if(a==='pick-json')document.getElementById('json-file').click();else if(a==='download-json')demoFormat();else if(a==='pick-video')document.getElementById('video-file').click();else if(a==='pick-html')document.getElementById('html-file').click();else if(a==='slides-open')openSlides();else if(a==='source-edit')askSource();else if(a==='save-source')saveSource();else if(a==='source-open'){const u=liveSrc(find(state.detail));if(/^https?:\/\//.test(u))window.open(u,'_blank','noopener,noreferrer');else notice('请先填写来源地址')}else if(a==='share-check')updateShare(id);else if(a==='remove-cache'){if(confirm('删除这条资料在当前浏览器保存的视频和 HTML 课件吗？原始资料记录不删除。')){removeFiles(id).then(()=>{delete state.cached[id];storage.set('p070_cached',state.cached);render();notice('已清理本地媒体文件')}).catch(()=>notice('清理失败，请重试'))}}else if(a==='clear-share'){if(state.selected.length&&confirm('清空分享清单吗？不会删除资料库中的视频。')){state.selected=[];storage.set('p070_selected',[]);render()}}else if(a==='copy-share')copyText(shareString());else if(a==='system-share')nativeShare();else if(a==='slide-close')closeSlides();else if(a==='slide-prev')stepSlide(-1);else if(a==='slide-next')stepSlide(1);else if(a==='slide-fullscreen')fullSlides()}
document.addEventListener('click',handleClick);document.addEventListener('input',e=>{if(e.target.id==='search-input'){state.q=e.target.value;refreshResults()}});document.addEventListener('keydown',e=>{if(document.getElementById('slide-modal')){if(e.key==='Escape')closeSlides();if(e.key==='ArrowRight')stepSlide(1);if(e.key==='ArrowLeft')stepSlide(-1)}});fileInputs();render();
